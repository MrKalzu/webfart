<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Webfart Forum</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app-container">
    <header>
      <nav class="nav-threads" id="threads-nav"></nav>
      <div class="thread-indicator" id="current-thread-label">/h/</div>
    </header>

    <div id="messages-wrap">
      <div id="messages-viewport">
        <div id="messages-list"></div>
      </div>
      <div id="unread-pill">New messages ↓</div>
    </div>

    <form id="post-bar" autocomplete="off">
      <div class="post-meta">
        <input type="text" id="nick-input" placeholder="Nick#Secret" maxlength="32"
               autocapitalize="off" autocorrect="off" spellcheck="false">
        <span id="byte-counter">0/1024 B</span>
      </div>
      <textarea rows="2" id="msg-input" placeholder="Write message..." maxlength="1024" required></textarea>
      <button type="submit" id="send-btn">Send</button>
    </form>

    <div id="status-line">
      <span id="anchor-info">Anchor: 00000000...</span>
      <span id="stream-status">Connecting...</span>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
